services:
  - type: web
    name: faceauth-final
    env: python
    plan: free
    buildCommand: python scripts/setup_models.py && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers=1 --threads=1 --timeout=60 --max-requests=200 --max-requests-jitter=20
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: JWT_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: INSIGHTFACE_MODEL
        value: buffalo_s
      - key: USE_GPU
        value: "false"
      - key: FACE_MATCH_THRESHOLD
        value: "0.50"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MAX_CONTENT_LENGTH
        value: "8388608"
